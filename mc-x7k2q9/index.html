# 입교식 · 행사 전 안내 | 10/21(수) 09:30
○ 연수생 여러분께서는 자리를 정돈하여 주시기 바랍니다.
○ 원활한 연수 진행을 위해 소지하고 계신 휴대폰은 전원을 꺼 주시거나, 무음 또는 진동 모드로 전환해주시기 바랍니다.
○ 오랜 시간 각자의 자리에서 쌓아 오신 노력이 5급 승진이라는 값진 결실로 이어졌습니다. 진심으로 축하드립니다.
○ 이번 2박 3일간의 연수는 나를 돌아보고(Lead Yourself), 경기교육의 내일을 그려보며(Lead the Future), 동료와 함께 이끄는 법(Lead Together)을 배우는 시간으로 준비했습니다.
○ 이곳에서 만난 동기들이 앞으로의 공직 여정에서 가장 든든한 동반자가 되기를 바랍니다.
# 식순 안내 | 3분
○ 잠시 후 입교식을 시작하기 전에 식순을 안내 드리겠습니다.
- 국민의례: 국기에 대한 경례 - 애국가 1절 제창 – 순국선열 및 호국영령에 대한 묵념
- 부장님의 간부직원 소개, 원장님 인사말씀(대독), 폐회
- 전체 사진촬영(외부, 본관 계단) 후 다시 착석하여 연수 전반에 대한 안내
# Ⅰ. 개회사 | 09:35
> 자리에서 나와 원장님께(부재 시 내빈석을 향해) 인사
○ 지금부터「2026년 5급 승진예정자 연수 입교식」을 시작하겠습니다.
# Ⅱ. 국민의례 (정식절차2)
○ 먼저 국민의례를 하겠습니다. 모두 자리에서 일어나 정면에 있는 국기를 향해 주시기 바랍니다. 거동이 불편한 분들은 자리에 앉은 채로 예를 갖추어 주시기 바랍니다.
○ 국기에 대하여, 경례!
○ 다음은 애국가를 제창하겠습니다. 반주에 맞춰 힘차게 불러주시기 바랍니다.
> 애국가 1절 연주 재생
> 멘트 후 돌아서서 함께 부르고 제자리로
○ 이어서, 순국선열과 호국영령에 대한 묵념을 올리겠습니다. 일동 묵념
> 묵념곡 재생
> 바로
○ 모두 자리에 앉아 주시기 바랍니다.
# Ⅲ. 간부직원 소개 및 인사말씀
○ 다음은 우리 연수원 구순이 행정연수부장님께서 간부직원을 소개해 주시겠습니다.
> 간부직원 소개 (행정연수부장)
○ 이어서 오늘 원장님께서 해외 연수 일정으로 함께 하지 못하신 관계로 원장님의 인사말씀을 구순이 행정연수부장님께서 대독해 주시겠습니다.
> 원장님 말씀 대독 (행정연수부장)
○ 원장님의 따뜻한 축하와 격려 말씀을 전해 주신 행정연수부장님, 감사드립니다.
# Ⅳ. 폐회사 및 기념촬영
○ 이상으로「2026년 5급 승진예정자 연수 입교식」을 모두 마치겠습니다.
○ 다음으로 사진 촬영이 있겠습니다. 사진 촬영 후에 연수생 여러분들은 모두 자리로 다시 돌아와 주시기 바랍니다. 이후 연수 전반에 대해 안내 드리도록 하겠습니다.
○ 그럼, 사진 촬영을 위해 간부직원과 연수생 여러분은 본관 앞 계단으로 이동 부탁드리겠습니다.
> 기념촬영
# Ⅴ. 연수 전체 안내
○ 우리 원에서의 연수는 단순한 강의 중심의 교육이 아니라, 서로의 경험을 나누고 배우는 참여형 연수로 운영됩니다. 모든 강의와 활동에 적극적으로 참여해 주시길 부탁드립니다.
- ▸ 식사: 조식 7:30~7:50, 중식 11:50~12:20, 석식 16:50~17:20 / 2일차 중식은 외부
- ▸ 생활관은 점심 식사 후 입실 안내, 야간 긴급상황은 당직실(031-950-0099)
- ▸ 이수 기준: 총 18시간의 90% 이상 출석
- ▸ 기타 안내 페이지의 내용 안내
# 1일차 ① 경기교육 대전환과 5대 핵심정책의 이해 | 10:00~12:00
○ 이어서 ‘경기교육 대전환과 5대 핵심정책의 이해’ 강의가 진행됩니다. 강의는 경기도교육청 김경관 정책기획관님께서 진행해 주시겠습니다.
○ 정책기획관님은 안양교육지원청 교육장을 역임하시고, 민선6기 경기도교육감직인수위원회에서 교육자치분과 전문위원으로서 경기교육 대전환의 정책 방향과 과제 설계에 앞장서신 분으로, RAS 교육 등 경기도교육청 핵심정책의 방향과 현장 안착을 위한 행정지원 과제를 들려주실 예정입니다. 큰 박수로 모시겠습니다.
> (강의 종료)
○ 정책은 문서 속에서 완성되는 것이 아니라, 현장에서 실천하는 여러분의 손끝에서 비로소 살아나는 것이라 생각합니다. 열띤 강의를 해 주신 김경관 정책기획관님께 감사의 박수 부탁드립니다.
○ 점심 식사 맛있게 하시고, 13시에 강의가 시작되오니 5분 전까지 착석 부탁드리겠습니다. 점심 식사 후에는 생활관 입실이 가능합니다.
# 1일차 ② 마음 근력 키우기 | 13:00~15:00
○ 점심식사 맛있게 드셨나요? 이번 시간은 새로운 역할 앞에서 나를 돌보고 단단하게 세우는 ‘마음 근력 키우기’ 강의입니다.
○ 이번 시간은 경기도교육청교직원복지센터 마음건강사업부에서 교직원의 마음건강과 정서회복을 위해 운영하는 프로그램입니다. 경기도교육청교직원복지센터에서는 심리상담을 비롯해 다양한 마음건강 프로그램과 교직원 복지사업을 지원하고 있으며, 이번 연수에서는 5급 승진예정자 여러분들의 마음을 돌볼 수 있는 프로그램을 마련해 주었습니다. 이 시간만큼은 업무에서 잠시 벗어나 편안하게 쉬어가는 시간이 되시길 바랍니다.
○ 강의는 더 프레젠트 마음연구소 조은이 소장님께서 진행해 주시겠습니다. 큰 박수 부탁드립니다.
> (강의 종료)
○ 다른 사람을 이끌기 전에 먼저 나를 돌보는 일이 얼마나 소중한지 느끼셨으리라 생각합니다. 조은이 소장님께 큰 박수 부탁드립니다.
## 분임 이동 안내 · 2일차 안내
○ 잠시 휴식 후 오후 세시부터는 선배 사무관님과의 대화가 이어집니다.
○ 2024~2025년에 이 과정을 먼저 거쳐 지금 현장에서 활약 중인 선배 사무관 다섯 분을 모셨습니다.
○ 특히 11월 2일부터 4주간 참여하실 대구 중앙교육연수원 과정의 평가와 생활에 대해서도 생생한 이야기를 들으실 수 있을 것입니다.
○ 선배님들은 각 분임실에서 기다리고 계시니, 휴식 후 안내 페이지의 분임 번호를 확인하시고 15시까지 본인 분임실로 이동해 주시기 바랍니다. 1분임은 이 곳 대강당에서 수업을 진행하고, 2분임부터 4분임까지는 옆의 분임실에서 수업을 진행합니다. 5분임은 구름다리를 건너서 행정연수부가 있는 후관동 2층의 행복누리에서 수업을 진행합니다.
○ 분임별 대화가 끝나면 오늘 일정은 모두 종료됩니다. 이 곳에서 다시 모이지 않고, 바로 저녁 식사와 자율활동을 하시면 됩니다.
○ 중요사항 말씀드리겠습니다. 내일은 이 곳 대강당을 다른 연수생들이 이용하기 때문에, 오늘 대강당에서는 개인 소지품을 모두 가져가셔야 합니다.
○ 내일 저희가 대강당에서 모일 수 없고 오전부터 분반 수업이 진행된 뒤 외부 체험 일정이 예정되어 있습니다. 따라서, 내일 일정도 먼저 안내해 드리겠습니다.
○ 오전 9시부터 ‘AI로 바꾸는 일하기 방식’ 실습이 3개 분반으로 진행됩니다. 연수번호 1번부터 32번은 1분반, 33번부터 64번은 2분반, 65번부터 97번은 3분반입니다. 강의실은 모두 후관동에 있으며, 1분반은 제1컴퓨터실, 2분반은 행복누리, 3분반은 제2컴퓨터실에서 수업을 진행합니다. 강의실 위치는 안내 페이지에서 확인하실 수 있습니다. 8시 50분까지 각 강의실에서 등록을 마쳐 주시기 바랍니다.

<script>
(function(){

var secs=[],items=[],cur=null;

function fmtText(t){return esc(t).replace(/\(\s{2,}\)/g,'<span class="blank">(&nbsp;&nbsp;&nbsp;&nbsp;)</span>')}
function mk(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;e.innerHTML=html;return e}
function newSec(title,time){
  var sec=document.createElement('section');sec.className='sec';
  var h=mk('h2','',esc(title)+(time?'<small>'+esc(time)+'</small>':''));sec.appendChild(h);
  stage.appendChild(sec);
  cur={id:secs.length,title:title,time:time,el:sec,head:h,items:[],target:null};

function add(el,kind,fix,chars){var it={el:el,kind:kind,fix:fix,chars:chars,sec:cur};cur.items.push(it);items.push(it);return it}
$('src').textContent.split('\n').forEach(function(raw){
  var l=raw.replace(/\s+$/,'');if(!l.trim())return;

  if(l.charAt(0)==='#'&&l.charAt(1)===' '){var p=l.slice(2).split(' | ');newSec(p[0],p[1]||'');return}
  if(l.slice(0,3)==='## '){var h=mk('h3','sub',esc(l.slice(3)));cur.el.appendChild(h);add(h,'sub',SUB_SEC,0);return}
  var ch=l.charAt(0),body=l.slice(2);
  var chars=body.replace(/\s/g,'').length;
  if(ch==='○'){var e=mk('p','ln',fmtText(body));cur.el.appendChild(e);add(e,'say',0,chars)}
  else if(ch==='-'){var e=mk('p','ln sub',fmtText(body));cur.el.appendChild(e);add(e,'say',0,chars)}
  else if(ch==='◇'){var e=mk('p','ln oth',fmtText(body));cur.el.appendChild(e);add(e,'say',0,Math.round(chars*.8))}
  else if(ch==='?'){var e=mk('p','ln alt',fmtText(body));cur.el.appendChild(e);add(e,'say',0,chars)}

/* ---- 시간 계산 ---- */

function secBase(s){var st=secStats(s);return st.fix+st.chars/S.cps}

var tl=[]; /* timeline per item: t0, d */
var total=0;
function recompute(){
  var t=0;
  secs.forEach(function(s){
    var st=secStats(s);
    var speech=Math.max(1,secDur(s)-st.fix);
    s.start=t;
    s.items.forEach(function(it){
      var d=it.fix;
      if(it.chars&&st.chars)d=speech*it.chars/st.chars;
      it.t0=t;it.d=d;t+=d;

    s.end=t;

  total=t;

function markerY(){return window.innerHeight*0.32}

}
function tForScroll(){
  var y=window.scrollY+markerY(),best=items[0];
  for(var i=0;i<items.length;i++){var it=items[i];if(elTop(it)<=y)best=it;else break}
  var h=elH(best),f=h>0?(y-elTop(best))/h:0;f=Math.min(1,Math.max(0,f));

/* ---- 현재 위치 표시 ---- */
var curEl=null,curSec=null;

  var tgt=best;
  if(best.kind==='note'||best.kind==='skip'){/* 메모는 직전 멘트 유지 */}
  if(curEl!==tgt.el){if(curEl)curEl.classList.remove('cur');tgt.el.classList.add('cur');curEl=tgt.el}
  if(curSec!==best.sec){curSec=best.sec;$('curTitle').textContent=curSec.title+(curSec.time?'  ·  '+curSec.time:'');tocMark()}
  var s=best.sec,tt=tForScroll();
  var done=Math.min(Math.max(tt-s.start,0),s.end-s.start);
  $('secInfo').textContent=fmt(done)+' / '+fmt(s.end-s.start);
  $('tVal').textContent=fmt(secDur(s));
  $('sVal').textContent=S.cps.toFixed(1)+'자/초';
}

/* ---- 재생 ---- */
function toast(msg){var t=$('toast');t.textContent=msg;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(function(){t.style.display='none'},2600)}
function setPlaying(p){playing=p;$('bPlay').textContent=p?'⏸ 정지':'▶ 재생';cancelAnimationFrame(raf);if(p){T=tForScroll();last=performance.now();raf=requestAnimationFrame(tick)}}
function tick(now){
  if(!playing)return;
  var dt=(now-last)/1000;last=now;
  T+=dt;
  if(T>=total){T=total-0.001;setScroll(scrollForT(T));sync();setPlaying(false);toast('끝까지 왔습니다');return}
  setScroll(scrollForT(T));sync();
  raf=requestAnimationFrame(tick);
}
function goSec(i){
  i=Math.max(0,Math.min(secs.length-1,i));
  var s=secs[i];setScroll(elTop(s.items[0])+4);T=s.start;sync();
}
function secIndex(){return curSec?curSec.id:0}
function stepLine(dir){
  var says=items.filter(function(it){return it.kind==='say'||it.kind==='cue'});
  var y=window.scrollY+markerY()+2,idx=-1;
  for(var i=0;i<says.length;i++){if(elTop(says[i])<=y)idx=i;else break}
  var n=dir>0?idx+1:(elTop(says[Math.max(idx,0)])<y-6?idx:idx-1);
  n=Math.max(0,Math.min(says.length-1,n));
  setScroll(elTop(says[n]));sync();
  if(playing)T=tForScroll();
}
['wheel','touchmove'].forEach(function(ev){window.addEventListener(ev,function(){if(playing)setPlaying(false)},{passive:true})});
window.addEventListener('scroll',function(){if(!playing)sync()},{passive:true});
window.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT')return;
  var k=e.key;
  if(k===' '||k==='Enter'){e.preventDefault();setPlaying(!playing)}
  else if(k==='ArrowRight'||k==='PageDown'){e.preventDefault();goSec(secIndex()+1)}
  else if(k==='ArrowLeft'||k==='PageUp'){e.preventDefault();goSec(secIndex()-(function(){var s=curSec;return elTop(s.items[0])<window.scrollY+markerY()-60?0:1})())}
  else if(k==='ArrowDown'){e.preventDefault();stepLine(1)}
  else if(k==='ArrowUp'){e.preventDefault();stepLine(-1)}
  else if(k==='+'||k==='='){chSpeed(.5)}
  else if(k==='-'){chSpeed(-.5)}
  else if(k==='Escape'){$('toc').classList.remove('on')}
});

/* ---- 컨트롤 ---- */
function reflow(keep){
  var tt=keep?tForScroll():0, id=curSec?curSec.id:0, f=0;
  recompute();
  if(keep){setScroll(scrollForT(Math.min(tt,total)));}
  if(playing)T=tForScroll();
  sync();tocBuild();
}
function chSpeed(d){S.cps=Math.min(12,Math.max(2,Math.round((S.cps+d)*10)/10));save();var s=curSec;var tt=tForScroll();var frac=(tt-s.start)/Math.max(1,s.end-s.start);recompute();T=s.start+frac*(s.end-s.start);setScroll(scrollForT(T));sync();tocBuild()}
function chTarget(d){
  var s=curSec;var tt=tForScroll();var frac=(tt-s.start)/Math.max(1,s.end-s.start);
  var st=secStats(s);var v=Math.max(st.fix+10,secDur(s)+d);s.target=v;
  recompute();T=s.start+frac*(s.end-s.start);setScroll(scrollForT(T));sync();tocBuild();
}
function resetTarget(){var s=curSec;var tt=tForScroll();var frac=(tt-s.start)/Math.max(1,s.end-s.start);s.target=null;recompute();T=s.start+frac*(s.end-s.start);setScroll(scrollForT(T));sync();tocBuild()}
$('bPlay').onclick=function(){$('panel').classList.remove('on');setPlaying(!playing)};
$('bNext').onclick=function(){goSec(secIndex()+1)};
$('bPrev').onclick=function(){var s=curSec;goSec(secIndex()-(elTop(s.items[0])<window.scrollY+markerY()-60?0:1))};
$('sMinus').onclick=function(){chSpeed(-.5)};$('sPlus').onclick=function(){chSpeed(.5)};
$('tMinus').onclick=function(){chTarget(-15)};$('tPlus').onclick=function(){chTarget(15)};$('tReset').onclick=resetTarget;
function setFs(){document.documentElement.style.setProperty('--fs',S.fs+'px');$('fVal').textContent=S.fs;save()}
$('fMinus').onclick=function(){var t=tForScroll();S.fs=Math.max(22,S.fs-2);setFs();setScroll(scrollForT(t));sync()};
$('fPlus').onclick=function(){var t=tForScroll();S.fs=Math.min(96,S.fs+2);setFs();setScroll(scrollForT(t));sync()};
function cueBtn(){$('bCue').textContent=S.cue?'보기':'숨김'}
$('bCue').onclick=function(){S.cue=!S.cue;document.body.classList.toggle('hidecue',!S.cue);cueBtn();save();setTimeout(sync,0)};
document.body.classList.toggle('hidecue',!S.cue);cueBtn();
$('bSet').onclick=function(){$('panel').classList.toggle('on')};
stage.addEventListener('click',function(){$('panel').classList.remove('on')});
setFs();

/* ---- 목차 ---- */
function tocBuild(){
  var h='<h4>구간 이동 (시간은 현재 속도 기준 예상)</h4>';
  secs.forEach(function(s){h+='<a data-i="'+s.id+'"'+(curSec&&curSec.id===s.id?' class="now"':'')+'><span>'+esc(s.title)+'</span><small>'+(s.time?esc(s.time)+' · ':'')+'낭독 '+fmt(secDur(s))+(s.target!=null?' ✎':'')+'</small></a>'});
  h+='<h4>전체 낭독 시간 합계 '+fmt(total)+'</h4>';
  $('tocBox').innerHTML=h;
}
function tocMark(){var a=$('tocBox').querySelectorAll('a');for(var i=0;i<a.length;i++)a[i].classList.toggle('now',curSec&&+a[i].dataset.i===curSec.id)}
$('bToc').onclick=function(){tocBuild();$('toc').classList.add('on')};
$('toc').onclick=function(e){var a=e.target.closest('a');if(a){setPlaying(false);$('toc').classList.remove('on');goSec(+a.dataset.i)}else if(e.target.id==='toc'){$('toc').classList.remove('on')}};

recompute();tocBuild();
window.scrollTo(0,0);
setTimeout(function(){goSec(0);window.scrollTo(0,0);sync()},50);
window.addEventListener('resize',function(){sync()});
})();
</script>
</body>
